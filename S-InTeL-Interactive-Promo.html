<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSP S-InTeL | Interactive Preview</title><style>body{margin:0;background:#0d2c20;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(900px,92vw);padding:30px}.brand{color:#9fe0b8;letter-spacing:3px;font-size:13px}.slide{min-height:390px;border:1px solid #397653;background:linear-gradient(135deg,#164d34,#087b43);border-radius:24px;padding:44px;display:flex;flex-direction:column;justify-content:center}.slide h1{font-size:clamp(35px,7vw,68px);line-height:1;margin:18px 0}.slide p{color:#d7eee0;max-width:610px;font-size:19px}.actions{display:flex;gap:12px;margin-top:25px;flex-wrap:wrap}button{padding:13px 19px;border:0;border-radius:10px;background:#fff;color:#075b35;font-weight:800;cursor:pointer}.secondary{background:#245b40;color:white;border:1px solid #72a98a}.dots{color:#a8d7ba;margin-top:18px}.foot{font-size:12px;color:#a9c8b5;margin-top:20px}</style></head><body><div class="wrap"><div class="brand">BSP S-InTeL · CYBERSECURITY INTELLIGENCE</div><div class="slide"><div id="count">01 / 04</div><h1 id="title">See threats sooner.</h1><p id="desc">A unified security operations view for incidents, assets, risk trends and management reporting.</p><div class="actions"><button id="next">Explore S-InTeL →</button><button class="secondary" id="back">Back</button><button class="secondary" id="demo">Open live prototype</button></div></div><div class="dots" id="dots">● ○ ○ ○</div><div class="foot">Concept demonstration only · All displayed activity is simulated · Not an official BSP product</div></div><script>let i=0;const s=[['See threats sooner.','A unified security operations view for incidents, assets, risk trends and management reporting.'],['Prioritise what matters.','Bring simulated alerts together, filter by severity and give analysts a clear queue for investigation.'],['Turn findings into action.','Explore
